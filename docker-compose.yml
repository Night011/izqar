services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: izqar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: izqar
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U izqar"]
      interval: 5s
      timeout: 4s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://izqar:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/izqar
      IZQAR_API_KEY: ${IZQAR_API_KEY:?Set IZQAR_API_KEY in .env}
      IZQAR_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - ./backend/models:/app/models:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api
volumes:
  pgdata:
